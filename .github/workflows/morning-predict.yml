name: KMIA Morning Predictor

on:
  schedule:
    # 14:00 UTC = 10:00 AM EDT
    # Change to 15:00 UTC when EST begins in November.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run KMIA morning predictor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_predict.py

      - name: Commit prediction history
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"

          git add prediction_history.json

          if git diff --staged --quiet; then
            echo "No prediction history changes to commit."
            exit 0
          fi

          git commit -m "Update KMIA prediction history [skip ci]"
          git pull --rebase origin main
          git push